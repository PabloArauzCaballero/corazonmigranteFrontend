# Plataforma completa de Corazón Migrante en local: base de datos, caché, API y web.
#
#   docker compose up --build
#   → web  http://localhost:8080
#   → api  http://localhost:3000/api/v1
#
# El backend vive en otro repositorio. Por defecto se espera como carpeta hermana;
# si está en otro sitio: BACKEND_CONTEXT=/ruta/al/backend docker compose up --build
#
# Nota: ningún servicio fija `container_name` y ni Postgres ni Redis publican puertos
# al host. Así esta pila convive con la del repositorio del backend, que usa esos
# mismos nombres y puertos, en lugar de chocar con ella.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: corazon_migrante
      POSTGRES_USER: corazon
      POSTGRES_PASSWORD: corazon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corazon -d corazon_migrante"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ${BACKEND_CONTEXT:-../corazonmigranteBackend}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      # El navegador carga la web desde :8080 y llama a la API en :3000: sin este
      # origen en la lista, cada petición del panel muere en el preflight de CORS.
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: corazon_migrante
      DATABASE_USER: corazon
      DATABASE_PASSWORD: corazon
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Secretos de desarrollo. En producción llegan del gestor de secretos, nunca
      # de este archivo.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-cambiar-min-32-caracteres}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-cambiar-min-32-caracteres}
      STORAGE_PROVIDER: LOCAL
      UPLOAD_DIR: storage/uploads
      PUBLIC_BASE_URL: http://localhost:3000
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - api_storage:/app/storage
    command: sh -c "npm run db:migrate && npm run db:seed && npm run start:prod"

  web:
    build:
      context: .
      args:
        # Las NEXT_PUBLIC_* se compilan dentro del bundle: cambiarlas obliga a
        # reconstruir la imagen (`docker compose build web`), no basta con reiniciar.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  postgres_data:
  api_storage:
