# Portal técnico del frontend de Corazón Migrante.
#
# INSTRUMENTACIÓN SEGURA: MkDocs NO es dependencia del proyecto ni participa en
# `next build`. El portal documental se construye por separado del bundle productivo.
# Requiere Python:
#
#   pip install mkdocs-material
#   mkdocs serve                 # http://localhost:8000
#   mkdocs build --strict        # falla ante cualquier enlace roto
#
# Si MkDocs no está disponible, la documentación sigue siendo legible como Markdown
# en el repositorio y en GitHub: ningún documento depende de este archivo.

site_name: Frontend Corazón Migrante
site_description: Documentación técnica del frontend — Next.js 15 exportado como HTML estático
docs_dir: docs
site_dir: .docs-site        # ignorado por git; nunca se mezcla con out/

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: brown
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: brown
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Validación estricta: cualquier enlace interno roto detiene la construcción.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  nav:
    omitted_files: info

