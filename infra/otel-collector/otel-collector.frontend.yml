# OpenTelemetry Collector — canal de trazas del FRONTEND
#
# Este pipeline procesa exclusivamente lo que llega del navegador, a través del
# gateway del mismo origen (`functions/otel/v1/traces.ts`). El tráfico del backend
# debe usar un pipeline distinto: tiene otro volumen, otra retención y otro perfil
# de riesgo.
#
# Principio: **la aplicación no depende de que esto esté vivo.** Si el Collector se
# cae, el gateway descarta el lote y el navegador sigue funcionando igual.

receivers:
  otlp:
    protocols:
      http:
        # Solo escucha en la red interna. NUNCA se publica este puerto a internet:
        # quien recibe al navegador es el gateway, no el Collector.
        endpoint: 0.0.0.0:4318
        # Sin CORS: el navegador jamás habla directamente con este receptor.

processors:
  # Primero de todo: un pico de tráfico del navegador no puede tumbar el proceso.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  # ─── Saneado defensivo ────────────────────────────────────────────────────────
  # El frontend ya sanea en origen (`sanitize.ts` + `SanitizingSpanProcessor`). Esto
  # es la segunda barrera: protege frente a una versión antigua del frontend todavía
  # cacheada en algún navegador, que podría estar emitiendo atributos ya prohibidos.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: http.request.body
        action: delete
      - key: http.response.body
        action: delete
      - key: url.query
        action: delete
      - key: url.fragment
        action: delete
      - key: user.id
        action: delete
      - key: user.email
        action: delete
      - key: enduser.id
        action: delete

  # Quita la query string de cualquier URL que haya sobrevivido, y con ella el
  # `?token=<JWT>` del stream de notificaciones y las URL firmadas de Cloudinary.
  transform/strip_query:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["url.full"], "\\?.*$", "")
          - replace_pattern(attributes["http.url"], "\\?.*$", "")
          - replace_pattern(span.name, "\\?.*$", "")

  # ─── Filtrado de ruido ────────────────────────────────────────────────────────
  filter/drop_noise:
    error_mode: ignore
    traces:
      span:
        # Peticiones a dominios de terceros que no aportan nada al diagnóstico.
        - 'attributes["network.request.type"] == "third-party"'
        # Recursos estáticos con hash: cada despliegue crearía nombres nuevos.
        - 'IsMatch(attributes["url.path"], "^/_next/static/")'

  # ─── Muestreo por traza completa ──────────────────────────────────────────────
  # Aquí sí se puede decidir con la traza terminada, cosa que el navegador no puede.
  # Se conserva SIEMPRE lo que se investiga: errores y latencia alta.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: conservar-errores
        type: status_code
        status_code: { status_codes: [ERROR] }

      - name: conservar-http-5xx
        type: numeric_attribute
        numeric_attribute: { key: http.response.status_code, min_value: 500, max_value: 599 }

      - name: conservar-http-4xx
        type: numeric_attribute
        numeric_attribute: { key: http.response.status_code, min_value: 400, max_value: 499 }

      - name: conservar-lentas
        type: latency
        latency: { threshold_ms: 3000 }

      - name: conservar-operaciones-criticas
        type: string_attribute
        string_attribute:
          key: app.feature
          values: [auth, appointments, files]

      - name: resto-al-10-por-ciento
        type: probabilistic
        probabilistic: { sampling_percentage: 10 }

  # El lote va al final: agrupa lo que realmente se va a exportar.
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  # Jaeger 2.x recibe OTLP de forma nativa; ya no existe el exportador `jaeger`.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      # Acotado a propósito: reintentar durante horas solo acumula memoria.
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces/frontend:
      receivers: [otlp]
      processors:
        - memory_limiter
        - attributes/redact
        - transform/strip_query
        - filter/drop_noise
        - tail_sampling
        - batch
      exporters: [otlp/jaeger]
  telemetry:
    logs:
      level: warn
    metrics:
      # Métricas internas del propio Collector (cola, descartes, latencia de export).
      level: normal
