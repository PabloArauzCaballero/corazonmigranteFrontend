# Validación documental.
#
# INSTRUMENTACIÓN SEGURA: pipeline SEPARADO de `ci.yml`, que no se modifica.
# Solo ejecuta validadores de lectura sobre docs/; no construye la aplicación, no
# publica artefactos y no puede alterar el producto.
#
# Política de adopción (Fase 17 del plan maestro): este workflow NO debe fallar por
# deuda preexistente. Bloquea únicamente lo que ya está en verde hoy —enlaces rotos,
# cobertura de rutas y marcadores provisionales— e informa del resto sin detener a
# nadie.

name: Documentación

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "scripts/check-doc-*.mjs"
      - "src/app/**"          # una ruta nueva puede romper la cobertura
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "scripts/check-doc-*.mjs"
      - "src/app/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validar documentación
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Los validadores no usan dependencias externas: Node puro. No hace falta
      # `yarn install`, lo que mantiene este job rápido e independiente del lockfile.

      - name: Enlaces internos
        run: node scripts/check-doc-links.mjs

      - name: Cobertura de rutas documentadas
        run: node scripts/check-doc-coverage.mjs

      - name: Marcadores provisionales
        run: |
          # La entrega final no debe contener marcadores sin resolver.
          #
          # Se busca la FORMA CONVENCIONAL de anotación —`TODO:`, `FIXME(`, o la
          # palabra sola como valor de celda `| TBD |`— y no la simple aparición de
          # la palabra. Sin esa precisión, la propia documentación que PROHÍBE los
          # marcadores ("Sin TODO, TBD ni secciones vacías") haría fallar el job.
          #
          # Se excluyen los identificadores PENDIENTE_CM_*: son un registro
          # deliberado y gobernado del equipo, no deuda documental.
          if grep -rnE '(\b(TODO|FIXME|XXX|TBD)\s*[:(]|\|\s*(TODO|TBD|FIXME|XXX)\s*\|)' \
               docs/ --include='*.md' \
               | grep -v 'PENDIENTE_CM'; then
            echo "::error::Se encontraron marcadores provisionales en docs/"
            exit 1
          fi
          echo "Sin marcadores provisionales."

      - name: Secretos en la documentación (informativo)
        continue-on-error: true
        run: |
          # Heurística deliberadamente conservadora: busca formas de secreto que
          # nunca deberían aparecer en documentación. No bloquea.
          if grep -rnE '(eyJ[A-Za-z0-9_-]{10,}\.|BEGIN [A-Z ]*PRIVATE KEY|api[_-]?secret\s*[:=]\s*["'"'"'][^"'"'"']{8,})' \
               docs/ --include='*.md'; then
            echo "::warning::Posible secreto en la documentación — revisar"
          else
            echo "Sin secretos aparentes."
          fi

  # Construcción del portal. Se ejecuta solo si mkdocs.yml existe y NUNCA bloquea:
  # MkDocs no es dependencia del proyecto y el portal es opcional.
  portal:
    name: Construir portal (opcional)
    runs-on: ubuntu-latest
    needs: validate
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar MkDocs Material
        run: pip install mkdocs-material

      - name: Construir en modo estricto
        run: mkdocs build --strict

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: portal-documental
          path: .docs-site/
          retention-days: 7
