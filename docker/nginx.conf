server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # El proyecto compila con `trailingSlash: true`, así que cada ruta es una carpeta
  # con su `index.html` (/admin/contenido/paginas/index.html). Sin este `try_files`
  # nginx devolvería 404 en cualquier recarga que no fuese la raíz.
  # El último salto es `=404` y no `/404.html`: sirviendo el fichero directamente,
  # nginx respondía 200 en una URL inexistente. Con `=404` entra `error_page`, que
  # pinta la misma página pero con el código correcto.
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  # Los assets de Next llevan hash en el nombre: son inmutables.
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # El HTML sí cambia en cada despliegue; que no se quede pegado en el navegador.
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  error_page 404 /404.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # El frontend es estático: no hay motivo para exponer la versión del servidor.
  server_tokens off;
}
